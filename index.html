<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Панно-свотч: раскладка крышек</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#1f1f1c;--tx2:#6b6a64;--bd:#dcdbd4;--ac:#2f5fd0;--acbg:#e6eefc;--er:#a32d2d;--erbg:#fcebeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--card:#242422;--tx:#ecebe5;--tx2:#a3a29a;--bd:#3d3d39;--ac:#8fb0ff;--acbg:#26324f;--er:#f09595;--erbg:#4a2323}}
:root[data-theme="dark"]{--bg:#1a1a18;--card:#242422;--tx:#ecebe5;--tx2:#a3a29a;--bd:#3d3d39;--ac:#8fb0ff;--acbg:#26324f;--er:#f09595;--erbg:#4a2323}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1200px;margin:0 auto;padding:20px 16px 40px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1 1 460px;min-width:0}
.pv{flex:1 1 360px;min-width:0}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
h2{font-size:16px;font-weight:500;margin:0 0 10px}
.sub{color:var(--tx2);font-size:14px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
label.f{display:block;font-size:12px;color:var(--tx2)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
label.f input,label.f select{width:100%;display:block;margin-top:2px}
button{cursor:pointer}button:hover{border-color:var(--tx2)}
button.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto}
.r{display:grid;grid-template-columns:38px minmax(110px,1fr) 84px 104px 58px 30px;gap:6px;align-items:center;min-width:470px;margin-bottom:6px}
.r.h{font-size:12px;color:var(--tx2);margin-bottom:4px}
.r input[type=color]{padding:0;width:38px;height:34px;border-radius:8px;cursor:pointer}
.r input,.r select{width:100%;min-width:0}
.x{padding:4px 0;color:var(--tx2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--bg);border-radius:8px;padding:8px 10px}
.st b{display:block;font-size:18px;font-weight:500}.st span{font-size:12px;color:var(--tx2)}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
.msg.e{background:var(--erbg);color:var(--er)}
.msg.i{background:var(--acbg);color:var(--ac)}
.pvbox{overflow:auto;border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--card);text-align:center}
textarea{width:100%;height:90px;font-size:13px;font-family:ui-monospace,monospace}
@media (min-width:900px){.pv{position:sticky;top:12px}}
</style></head><body>
<div class="app">
<div class="col">
<h1>Панно-свотч для крышек</h1>
<p class="sub">Введите размеры панно и список крышек. Схема раскладки обновляется сразу.</p>

<div class="card"><h2>Размеры, см</h2>
<div class="g">
<label class="f">Панно, ширина<input type="number" id="W" min="10" step="1"></label>
<label class="f">Панно, высота<input type="number" id="H" min="10" step="1"></label>
<label class="f">Крышка, ширина<input type="number" id="cw" min="1" step="0.5"></label>
<label class="f">Крышка, высота<input type="number" id="ch" min="1" step="0.5"></label>
</div>
<div class="row"><span style="font-size:12px;color:var(--tx2)">Плотность</span>
<div class="seg" id="dens"><button data-d="dense">Плотно</button><button data-d="bal">Сбалансированно</button><button data-d="air">Воздушно</button></div></div>
<div class="g" style="margin-top:10px">
<label class="f">Столбцов<select id="cols"></select></label>
<label class="f">Фон панно<input type="color" id="bgc" style="height:34px;padding:2px"></label>
<label class="f" style="display:flex;align-items:end;gap:6px"><input type="checkbox" id="lab" style="width:auto"> подписи под крышками</label>
</div></div>

<div class="card"><h2>Крышки</h2>
<div class="tw"><div class="r h"><span>Цвет</span><span>Название</span><span>Артикул</span><span>Тип</span><span>Шт.</span><span></span></div>
<div id="rows"></div></div>
<div class="row"><button id="add">+ Добавить цвет</button><button id="imp">Вставить из Excel</button><button id="clr">Очистить всё</button></div>
<div id="impbox" style="display:none;margin-top:10px">
<p class="sub" style="margin:0 0 6px;font-size:13px">Колонки: название, артикул, цвет (#hex), тип (узкая или округлая), количество. Разделитель: табуляция, точка с запятой или запятая.</p>
<textarea id="ta" placeholder="Лайм&#9;WN-12&#9;#b6cf3a&#9;округлая&#9;3"></textarea>
<div class="row"><button id="go">Загрузить</button></div></div>
</div>
</div>

<div class="pv">
<div class="stats" id="stats"></div>
<div id="msg"></div>
<div class="pvbox" id="box"><svg id="svg" role="img" aria-label="Схема раскладки панно"></svg></div>
<div class="row"><span style="font-size:12px;color:var(--tx2)">Масштаб</span><input type="range" id="zoom" min="160" max="620" step="10" value="300" style="flex:1"></div>
</div>
</div>
<script>
var DEF={W:78,H:250,cw:11,ch:25,bg:"#8a8a86",lab:true,dens:"bal",cols:0,rows:[
{n:"Белый",c:"WH-01",k:"#f4f4f2",t:"r",q:3},{n:"Лайм",c:"LM-02",k:"#b6cf3a",t:"r",q:3},{n:"Оранжевый",c:"OR-03",k:"#e58a35",t:"n",q:2},
{n:"Голубой",c:"BL-04",k:"#6fa8e0",t:"n",q:2},{n:"Розовый",c:"PK-05",k:"#c8579a",t:"r",q:3},{n:"Бордо",c:"BD-06",k:"#7a2335",t:"r",q:3},
{n:"Тёмно-синий",c:"NV-07",k:"#26305e",t:"r",q:3},{n:"Чёрный",c:"BK-08",k:"#1e1e1e",t:"r",q:3}]};
var S;
try{S=JSON.parse(localStorage.getItem("swatch-panel-v1")||"null")}catch(e){S=null}
if(!S||!S.rows)S=JSON.parse(JSON.stringify(DEF));
var Z=300;
var DN={dense:{g:2,m:1,name:"Плотно"},bal:{g:3.5,m:4.5,name:"Сбалансированно"},air:{g:5,m:7,name:"Воздушно"}};
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem("swatch-panel-v1",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v,d){v=parseFloat(String(v).replace(",","."));return v>0?v:d}
function lum(h){var n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255}
function fix(h){h=String(h||"").trim();if(/^[0-9a-f]{6}$/i.test(h))h="#"+h;return/^#[0-9a-f]{6}$/i.test(h)?h.toLowerCase():"#999999"}
function f1(x){return(Math.round(x*10)/10).toString().replace(".",",")}

function items(){var a=[];S.rows.forEach(function(r){var q=Math.max(0,Math.floor(Number(r.q)||0));for(var i=0;i<q;i++)a.push(r)});return a}

function fit(N,dn,forceC){
var W=S.W,H=S.H,cw=S.cw,ch=S.ch,g=dn.g,m=dn.m,cellH=ch+(S.lab?3:0);
var maxC=Math.floor((W-2*m+g)/(cw+g)),maxR=Math.floor((H-2*m+g)/(cellH+g));
var best=null;
for(var c=1;c<=Math.max(maxC,0);c++){
if(forceC&&c!==forceC)continue;
var r=Math.ceil(N/c);if(r>maxR)continue;
var gh=c>1?(W-2*m-c*cw)/(c-1):g,gv=r>1?(H-2*m-r*cellH)/(r-1):g;
var sc=Math.abs(Math.min(gh,10)-Math.min(gv,10))+(c===1?5:0);
if(!best||sc<best.sc)best={c:c,r:r,gh:Math.min(gh,10),gv:Math.min(gv,10),sc:sc};
}
return{best:best,maxC:maxC,maxR:maxR,cap:Math.max(maxC,0)*Math.max(maxR,0),cellH:cellH};
}

function shape(x,y,cw,ch,k,t){
var st=lum(k)>0.8?"#777":"rgba(0,0,0,.35)",o="";
if(t==="n"){
o+='<rect x="'+(x+cw*.32)+'" y="'+y+'" width="'+cw*.36+'" height="'+ch*.2+'" rx="'+cw*.12+'" fill="'+k+'" stroke="'+st+'" stroke-width=".3"/>';
o+='<rect x="'+x+'" y="'+(y+ch*.16)+'" width="'+cw+'" height="'+ch*.84+'" rx="'+cw*.4+'" fill="'+k+'" stroke="'+st+'" stroke-width=".3"/>';
}else{
o+='<rect x="'+(x+cw*.365)+'" y="'+y+'" width="'+cw*.27+'" height="'+ch*.16+'" rx="'+cw*.1+'" fill="'+k+'" stroke="'+st+'" stroke-width=".3"/>';
o+='<ellipse cx="'+(x+cw/2)+'" cy="'+(y+ch*.58)+'" rx="'+cw/2+'" ry="'+ch*.42+'" fill="'+k+'" stroke="'+st+'" stroke-width=".3"/>';
}
return o;
}

function draw(){
var W=S.W,H=S.H,cw=S.cw,ch=S.ch,N=items().length,dn=DN[S.dens]||DN.bal;
var f=fit(N,dn,S.cols||0),b=f.best;
var svg=$("svg"),msg=$("msg"),stats=$("stats");
svg.setAttribute("viewBox","-2 -2 "+(W+4)+" "+(H+4));
svg.style.width=Z+"px";svg.style.maxWidth="none";svg.style.height="auto";
var s='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+S.bg+'" stroke="#444" stroke-width=".4"/>';
var m="";
if(N===0){m='<div class="msg i">Добавьте крышки в таблицу, и схема появится здесь.</div>'}
else if(!b){
var alts=Object.keys(DN).map(function(k){var q=fit(N,DN[k],0);return DN[k].name+": "+q.cap});
m='<div class="msg e">Не помещается: '+N+' шт. при выбранных настройках максимум '+f.cap+'. Вместимость по режимам плотности: '+alts.join("; ")+'.'+(S.lab?" Попробуйте отключить подписи.":"")+(S.cols?" Или поставьте столбцы в «Авто».":"")+'</div>';
}
if(b){
var bw=b.c*cw+(b.c-1)*b.gh,bh=b.r*f.cellH+(b.r-1)*b.gv,x0=(W-bw)/2,y0=(H-bh)/2;
var its=items(),bgl=lum(S.bg),tc=bgl>0.6?"#222":"#f2f2f0";
its.forEach(function(it,i){
var c=i%b.c,r=Math.floor(i/b.c),x=x0+c*(cw+b.gh),y=y0+r*(f.cellH+b.gv),k=fix(it.k);
s+=shape(x,y,cw,ch,k,it.t);
if(S.lab){
var mx=Math.max(4,Math.floor((cw+Math.min(b.gh,4))/1.0));
var l1=esc(String(it.c||"").slice(0,mx)),l2=esc(String(it.n||"").slice(0,mx));
s+='<text x="'+(x+cw/2)+'" y="'+(y+ch+1.9)+'" font-size="1.7" text-anchor="middle" fill="'+tc+'" font-family="system-ui,sans-serif" font-weight="600">'+l1+'</text>';
s+='<text x="'+(x+cw/2)+'" y="'+(y+ch+3.7)+'" font-size="1.5" text-anchor="middle" fill="'+tc+'" opacity=".8" font-family="system-ui,sans-serif">'+l2+'</text>';
}
});
var cap=b.c*b.r;
var empty=cap-N;
if(S.lab&&b.gv<0)m+='';
stats.innerHTML=st("Крышек",N)+st("Сетка",b.c+" × "+b.r)+st("Зазор по гориз.",f1(b.gh)+" см")+st("Зазор по верт.",f1(b.gv)+" см")+st("Поля по бокам",f1(x0)+" см")+st("Поля сверху",f1(y0)+" см")+st("Заполнение",Math.round(N*cw*ch/(W*H)*100)+"%");
if(empty>0)m+='<div class="msg i">В последнем ряду свободно мест: '+empty+'.</div>';
if(b.gh<2.5||b.gv<2.5)m+='<div class="msg i">Зазоры меньше 2,5 см: панно будет смотреться плотно. Для воздуха сократите количество или выберите другой режим.</div>';
}else{stats.innerHTML=st("Крышек",N)+st("Вместимость",f.cap+" шт.")}
svg.innerHTML=s;msg.innerHTML=m;save();
}
function st(l,v){return'<div class="st"><b>'+esc(v)+'</b><span>'+l+'</span></div>'}

function colsOpts(){
var o='<option value="0">Авто</option>';
for(var i=1;i<=10;i++)o+='<option value="'+i+'">'+i+'</option>';
$("cols").innerHTML=o;$("cols").value=String(S.cols||0);
}
function rowsUI(){
var h="";
S.rows.forEach(function(r,i){
h+='<div class="r" data-i="'+i+'"><input type="color" data-f="k" value="'+fix(r.k)+'" aria-label="Цвет">'+
'<input data-f="n" value="'+esc(r.n)+'" placeholder="Название">'+
'<input data-f="c" value="'+esc(r.c)+'" placeholder="Артикул">'+
'<select data-f="t"><option value="r"'+(r.t==="r"?" selected":"")+'>Округлая</option><option value="n"'+(r.t==="n"?" selected":"")+'>Узкая</option></select>'+
'<input type="number" min="0" step="1" data-f="q" value="'+(r.q||0)+'">'+
'<button class="x" data-del="'+i+'" aria-label="Удалить">✕</button></div>';
});
$("rows").innerHTML=h;
}
function syncSet(){
["W","H","cw","ch"].forEach(function(k){$(k).value=S[k]});
$("bgc").value=S.bg;$("lab").checked=!!S.lab;
[].forEach.call($("dens").children,function(b){b.classList.toggle("on",b.getAttribute("data-d")===S.dens)});
}
["W","H","cw","ch"].forEach(function(k){$(k).addEventListener("input",function(){S[k]=num(this.value,DEF[k]);draw()})});
$("bgc").addEventListener("input",function(){S.bg=this.value;draw()});
$("lab").addEventListener("change",function(){S.lab=this.checked;draw()});
$("cols").addEventListener("change",function(){S.cols=parseInt(this.value,10)||0;draw()});
$("dens").addEventListener("click",function(e){var d=e.target.getAttribute("data-d");if(!d)return;S.dens=d;syncSet();draw()});
$("zoom").addEventListener("input",function(){Z=parseInt(this.value,10);draw()});
$("rows").addEventListener("input",function(e){
var row=e.target.closest(".r");if(!row)return;var r=S.rows[+row.getAttribute("data-i")],f=e.target.getAttribute("data-f");
if(!r||!f)return;r[f]=f==="q"?Math.max(0,parseInt(e.target.value,10)||0):e.target.value;draw();
});
$("rows").addEventListener("click",function(e){
var d=e.target.getAttribute("data-del");if(d===null)return;S.rows.splice(+d,1);rowsUI();draw();
});
$("add").addEventListener("click",function(){S.rows.push({n:"",c:"",k:"#999999",t:"r",q:1});rowsUI();draw()});
$("clr").addEventListener("click",function(){S.rows=[];rowsUI();draw()});
$("imp").addEventListener("click",function(){var b=$("impbox");b.style.display=b.style.display==="none"?"block":"none"});
$("go").addEventListener("click",function(){
var out=[];
$("ta").value.split(/\r?\n/).forEach(function(l){
if(!l.trim())return;
var p=l.indexOf("\t")>-1?l.split("\t"):(l.indexOf(";")>-1?l.split(";"):l.split(","));
p=p.map(function(x){return x.trim()});
var q=parseInt(p[4],10);if(isNaN(q)){return}
out.push({n:p[0]||"",c:p[1]||"",k:fix(p[2]),t:/уз|nar|^n/i.test(p[3]||"")?"n":"r",q:q});
});
if(out.length){S.rows=out;rowsUI();draw();$("impbox").style.display="none"}
});
colsOpts();syncSet();rowsUI();draw();
</script>
</body></html>
